[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossi"
dynamic = ["version"]
description = "Personal assistant that runs locally, with no AI key"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ossi = "ossi.cli:main"

[project.gui-scripts]
ossi-gui = "ossi.gui:main"

[tool.setuptools.dynamic]
version = { attr = "ossi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ossi = ["assets/*.ico", "assets/*.png"]
